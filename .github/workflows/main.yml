name: Flutter APK Build

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kodni yuklash
      uses: actions/checkout@v4

    - name: Java-ni o'rnatish
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Flutter-ni o'rnatish
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.6' # Agar o'zingizda boshqa versiya bo'lsa, o'zgartirishingiz mumkin
        channel: 'stable'

    - name: Kutubxonalarni yuklash
      run: flutter pub get

    - name: APK-ni yig'ish (Build)
      run: flutter build apk --release

    - name: Tayyor APK-ni yuklab olish uchun chiqarish
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
